<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DeepSeek Harness</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #1a1d24;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  body { padding: 10px; }

  .card {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 11px 13px 11px;
    border-radius: 14px;
    background: #ffffff;
    border: 1px solid #e8eaf1;
    box-shadow: 0 7px 18px rgba(23, 26, 31, 0.14);
    opacity: 0;
    transform: translateY(6px);
    animation: in 180ms ease-out forwards;
  }

  @keyframes in { to { opacity: 1; transform: translateY(0); } }

  .card.compact { justify-content: center; }

  .head { display: flex; align-items: center; gap: 7px; }

  .pill {
    flex: none;
    font-size: 10.5px;
    line-height: 1;
    color: #3b55e6;
    background: #eef2ff;
    border: 1px solid #e0e7ff;
    padding: 3px 6px;
    border-radius: 6px;
  }

  .pill.warn { color: #b25a12; background: #fff4e8; border-color: #ffe2c4; }
  .pill.plain { color: #5b6480; background: #f2f4f9; border-color: #e8ebf3; }

  .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .close {
    margin-left: auto;
    flex: none;
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border: 0;
    background: transparent;
    color: #a8afbd;
    font-size: 13px;
    line-height: 1;
    border-radius: 5px;
    cursor: pointer;
  }

  .close:hover { background: #f3f5f9; color: #6b7280; }

  .body {
    margin-top: 5px;
    font-size: 11.5px;
    line-height: 1.5;
    color: #7c8496;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .actions {
    margin-top: auto;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding-top: 9px;
  }

  button.act {
    font-family: inherit;
    font-size: 11.5px;
    padding: 5px 11px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter 120ms ease, background 120ms ease;
  }

  button.primary { background: #4d6bfe; color: #fff; }
  button.primary:hover { filter: brightness(1.06); }

  button.ghost { background: #fff; border-color: #e2e6f0; color: #4a5164; }
  button.ghost:hover { background: #f7f8fc; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <span class="pill" id="pill">更新</span>
      <span class="title" id="title">新版本可用</span>
      <button class="close" id="close" title="关闭">✕</button>
    </div>
    <div class="body" id="body"></div>
    <div class="actions" id="actions">
      <button class="act ghost" id="later">稍后</button>
      <button class="act primary" id="go">立即更新</button>
    </div>
  </div>

<script>
  const pillEl = document.getElementById('pill');
  const titleEl = document.getElementById('title');
  const bodyEl = document.getElementById('body');
  const actionsEl = document.getElementById('actions');

  const bridge = window.__TAURI__;
  let hideTimer = 0;

  function render(payload) {
    if (!payload) return;
    clearTimeout(hideTimer);

    titleEl.textContent = payload.title || '';
    titleEl.title = payload.title || '';
    bodyEl.textContent = payload.body || '';

    if (payload.kind === 'update') {
      pillEl.textContent = '更新';
      pillEl.className = 'pill';
    } else if (payload.kind === 'error') {
      pillEl.textContent = '失败';
      pillEl.className = 'pill warn';
    } else {
      pillEl.textContent = '提示';
      pillEl.className = 'pill plain';
    }

    actionsEl.style.display = payload.action ? 'flex' : 'none';
    document.getElementById('card').classList.toggle('compact', !payload.action);

    if (!payload.action && payload.auto_hide_ms > 0) {
      hideTimer = setTimeout(() => bridge.core.invoke('dsh_dismiss'), payload.auto_hide_ms);
    }
  }

  if (bridge) {
    bridge.event.listen('dsh-toast', (event) => render(event.payload));
    bridge.core.invoke('dsh_toast_current').then(render).catch(() => {});

    document.getElementById('go').onclick = () => bridge.core.invoke('dsh_update_now');
    document.getElementById('later').onclick = () => bridge.core.invoke('dsh_dismiss');
    document.getElementById('close').onclick = () => bridge.core.invoke('dsh_dismiss');
  } else {
    // 浏览器里直接打开时给个样例，方便调样式
    setTimeout(
      () =>
        render({
          kind: 'update',
          title: '新版本 v0.2.3 可用',
          body: '当前 v0.2.2，更新后需要重启应用',
          action: true,
        }),
      300
    );
  }
</script>
</body>
</html>
